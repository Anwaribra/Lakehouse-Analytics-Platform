lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/data/warehouse.duckdb') }}"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_region: us-east-1
    host:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'target/warehouse.duckdb') }}"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "127.0.0.1:9000"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_region: us-east-1
